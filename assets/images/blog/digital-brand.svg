<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001830"/>
      <stop offset="100%" stop-color="#1050c0"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.72)"/>
    </linearGradient>
    <linearGradient id="subtle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </linearGradient>
  </defs>
  <!-- Base gradient -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Subtle horizontal darkening -->
  <rect width="800" height="450" fill="url(#subtle)"/>
  <!-- Decorative geometry -->
  
    <circle cx="640" cy="100" r="140" fill="#6AABFF" opacity="0.06"/>
    <circle cx="700" cy="60" r="80" fill="#6AABFF" opacity="0.08"/>
    <circle cx="580" cy="200" r="60" fill="#6AABFF" opacity="0.05"/>
    <text x="660" y="180" font-family="Arial" font-size="96" fill="#6AABFF" opacity="0.12" text-anchor="middle">⬡</text>
    
  <!-- Bottom overlay for text legibility -->
  <rect width="800" height="450" fill="url(#overlay)"/>
  <!-- Category label -->
  <text x="36" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800"
    font-size="10" fill="#6AABFF" letter-spacing="3" text-transform="uppercase"
    style="text-transform:uppercase;letter-spacing:3px">BRAND IDENTITY</text>
  <!-- Title lines (bottom-up) -->
  <text x="36" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="0.5">Presence</text><text x="36" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="0.5">Building Your Digital</text>
</svg>